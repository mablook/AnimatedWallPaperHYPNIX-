name: Release (website installer)

# Builds the Velopack installer + delta update package for the website distribution channel. The
# GitHub repository is private, so this workflow does NOT publish to GitHub Releases (a private
# repo's Releases are not a usable public feed). It uploads the packaged 'releases' folder as a
# build artifact; publish it by copying those files to your public release host (the URL the app's
# UpdateService points at). For the Microsoft Store channel see scripts/package-msix.ps1.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'SemVer to release, without the leading v (e.g. 1.2.3)'
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build website installer and update package
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve version
        id: ver
        run: |
          $v = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ github.event.inputs.version }}' } else { '${{ github.ref_name }}'.TrimStart('v') }
          if ($v -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "Invalid version: $v" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Install Velopack CLI (matches the Velopack package version)
        run: dotnet tool install -g vpk --version 1.2.0

      - name: Publish self-contained win-x64
        run: dotnet publish AnimatedWallPaper.csproj -c Release -p:PublishProfile=win-x64-self-contained "-p:PublishDir=$env:GITHUB_WORKSPACE/publish/" "-p:Version=${{ steps.ver.outputs.version }}"

      # Optional: pull the current live release from the public feed so vpk can build a small delta.
      # Set the RELEASE_FEED_URL repository variable to your host; skipped (full-only) if unset.
      - name: Download live release for delta
        if: ${{ vars.RELEASE_FEED_URL != '' }}
        continue-on-error: true
        run: vpk download http --url ${{ vars.RELEASE_FEED_URL }} -o releases -c win

      # packId 'HypnixWallpaper' keeps the install (%LocalAppData%\HypnixWallpaper) separate from user
      # data (%LocalAppData%\HYPNIX); the friendly name/shortcuts stay "HYPNIX" via --packTitle.
      - name: Pack Velopack release
        run: vpk pack -u HypnixWallpaper -v ${{ steps.ver.outputs.version }} -p "$env:GITHUB_WORKSPACE/publish" -e HYPNIX.exe -o releases -c win --packTitle HYPNIX --packAuthors "Marcelo Bossle" -i Assets/Brand/hypnix-v2.ico

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hypnix-release-${{ steps.ver.outputs.version }}
          path: releases/*
          if-no-files-found: error
          retention-days: 14
