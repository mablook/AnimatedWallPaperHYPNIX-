name: Release (website installer)

# Builds the Velopack installer + delta update package for the website distribution channel. The
# GitHub repository is private, so this workflow does NOT publish to GitHub Releases (a private
# repo's Releases are not a usable public feed). It uploads the packaged 'releases' folder as a
# build artifact; publish it by copying those files to your public release host (the URL the app's
# UpdateService points at). For the Microsoft Store channel see scripts/package-msix.ps1.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'SemVer to release, without the leading v (e.g. 1.2.3)'
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build website installer and update package
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve version
        id: ver
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $v = if ($env:EVENT_NAME -eq 'workflow_dispatch') { $env:INPUT_VERSION } else { $env:REF_NAME.TrimStart('v') }
          if ($v -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') { throw "Invalid stable version: $v" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Install Velopack CLI (matches the Velopack package version)
        run: dotnet tool install -g vpk --version 1.2.0

      - name: Run regression tests before packaging
        run: dotnet test Tests/Hypnix.Tests/Hypnix.Tests.csproj -c Release --logger "trx;LogFileName=regression.trx" --results-directory artifacts/test-results

      - name: Download live release for delta
        if: ${{ vars.RELEASE_FEED_URL != '' }}
        env:
          FEED_URL: ${{ vars.RELEASE_FEED_URL }}
        run: vpk download http --url "$env:FEED_URL" -o releases -c win

      # Use the same script locally and in CI. It corrects and validates the MSI BEFORE delivery.
      - name: Build and validate EXE and MSI
        env:
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
        run: ./scripts/package-release.ps1 -Version $env:RELEASE_VERSION -OutputDir releases

      - name: Test real EXE and MSI installation, repair and uninstall
        run: ./scripts/test-distribution-install.ps1 -ReleaseDirectory releases -OutputDirectory artifacts/install-validation

      - name: Upload validation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: hypnix-release-validation
          path: |
            artifacts/test-results/*.trx
            artifacts/install-validation/*.log
            artifacts/install-validation/results.json
          if-no-files-found: warn

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hypnix-release-${{ steps.ver.outputs.version }}
          path: releases/*
          if-no-files-found: error
          retention-days: 14
